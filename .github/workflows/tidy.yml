name: Tidy up

# Closes submissions nobody is going to come back to, and removes the branches
# left behind by ones that are finished.
#
# Without this the repository slowly fills with open issues waiting on authors
# who moved on, and with submission/* branches that were merged months ago. The
# queue is meant to be a list of things that need doing, and a queue full of
# things that do not stops being read.
#
# Nothing here decides anything about a pack. Closing a stale submission is not
# a refusal — the author can publish again from the app whenever they like, and
# the closing message says so.

on:
  schedule:
    # Weekly. This is tidying, not moderation, and running it daily would only
    # mean more mail for no more benefit.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Close submissions nobody has come back to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Sixty days with no activity at all. Long enough that anybody still
          # interested has had every chance, short enough that the queue does
          # not become a graveyard.
          cutoff=$(date -u -d '60 days ago' +%Y-%m-%d)

          gh issue list --repo "$REPO" --state open --label submission \
            --search "updated:<$cutoff" --json number --jq '.[].number' \
          | while read -r n; do
              [ -z "$n" ] && continue
              echo "closing #$n"
              gh issue close "$n" --repo "$REPO" --comment \
                "Closing this because nothing has happened on it for two months. This is not a refusal — publish the pack again from the app whenever you are ready and a fresh submission will open."
            done

      - name: Remove branches from finished submissions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --prune origin '+refs/heads/submission/*:refs/remotes/origin/submission/*' || true

          for ref in $(git branch -r --list 'origin/submission/*' | sed 's|origin/||'); do
            number="${ref#submission/}"
            # Only branches whose issue is done with. An open submission still
            # needs its branch to merge.
            state=$(gh issue view "$number" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              echo "keeping $ref (#$number is still open)"
              continue
            fi
            echo "deleting $ref (#$number is $state)"
            git push origin --delete "$ref" || true
          done
