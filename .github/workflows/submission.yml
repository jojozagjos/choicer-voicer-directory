name: Pack submission

# Runs when the app opens a submission issue. Validates the record and either
# adds it to index.json or says on the issue what was wrong. Nobody approves
# anything: a pack that passes its checks is listed here and the issue closed.

on:
  issues:
    # `labeled` as well as the obvious two, and that is not belt and braces.
    #
    # The app creates the issue and applies its label in a single API call, and
    # GitHub does not always have the label attached by the time the `opened`
    # event is sent; labelling arrives moments later as its own event. So the
    # payload for `opened` can carry an empty labels array for an issue that
    # very much has one.
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  # Whether this issue is a submission at all, decided in a job of its own.
  #
  # This used to be a job-level `if` reading the labels straight off the event,
  # and it silently answered false for every real submission because of the race
  # above: the runs all completed as "skipped" and no pack was ever listed. A
  # condition that cannot be seen when it is wrong is worse than one that costs
  # a few seconds of runner time, so this decides in the open and says why.
  triage:
    runs-on: ubuntu-latest
    outputs:
      submission: ${{ steps.look.outputs.submission }}
    steps:
      - id: look
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || {};
            const labels = (issue.labels || []).map((l) => l.name);
            // The record itself is the second answer. A submission is an issue
            // with a fenced json block the app wrote, whatever the labels have
            // caught up to, so a missing label cannot lose a real pack.
            const hasRecord = /```json/.test(issue.body || '');
            const submission = labels.includes('submission') || hasRecord;

            core.info(`labels: ${JSON.stringify(labels)}`);
            core.info(`has a record: ${hasRecord}`);
            core.info(`treating as a submission: ${submission}`);
            core.setOutput('submission', submission ? 'yes' : 'no');

  review:
    needs: triage
    if: needs.triage.outputs.submission == 'yes'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fetched from the app rather than kept here. The directory has to refuse
      # exactly what the app refuses, and two copies of that rule drift the
      # moment one of them is edited — which is not noticed until something
      # invalid is listed, or something valid is turned away.
      - name: Fetch the validator from the app
        run: |
          base=https://raw.githubusercontent.com/jojozagjos/Choicer-Voicer-Content-Manager/main/src/main
          curl -fsSL "$base/directory.js" -o scripts/directory.js

      - name: Read the issue
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue-body.txt

      - name: Validate and add
        id: add
        continue-on-error: true
        # Through the environment, never interpolated into the command text.
        # See the note in moderate.yml: that position is where attacker-
        # controlled text would become executable.
        env:
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: node scripts/add-submission.js issue-body.txt "$SUBMITTER"

      - name: Say what was wrong
        if: steps.add.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const why = fs.existsSync('submission-error.txt')
              ? fs.readFileSync('submission-error.txt', 'utf8')
              : 'The submission could not be read.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: why + '\n\nFix it and edit the issue, and this will run again.',
            });

      # Before anything is listed, and on every submission including the ones
      # that never wait for a person. A check that only runs when somebody is
      # watching is a check that does not run.
      - name: Ask VirusTotal about the file
        id: virus
        if: steps.add.outcome == 'success'
        continue-on-error: true
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node scripts/virus-check.js "$(cat submission-sha.txt 2>/dev/null)"

      - name: Refuse a file that is flagged
        if: steps.virus.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const why = fs.existsSync('virus-error.txt')
              ? fs.readFileSync('virus-error.txt', 'utf8')
              : 'This file was refused by the malware check.';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body: why,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed',
            });
            core.setFailed('refused by the malware check');
      # Everything that passed the checks is listed, straight away.
      #
      # There is no approval step and no queue. Every rule that decides whether
      # a pack belongs here is enforced above and none of them is a judgement
      # about the content: the record has to validate, the author has to be the
      # account hosting the file, the file has to pass the malware check, and
      # the account must not be banned. Anything that clears all of that goes
      # on the list; anything that does not was already refused with a reason.
      #
      # Reading and passing judgement on what other people upload is a
      # different undertaking from running a list of links, and not one this
      # project is set up for. Moderation is after the fact instead: anybody can
      # report a pack, and /hide and /ban deal with it.
      #
      # Committed straight to main. There are no pull requests anywhere in this
      # flow: opening one from a workflow needs a repository setting that is off
      # by default, which meant every submission failed at that step and could
      # never be listed however long anybody waited.
      - name: List it
        if: steps.add.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "List a pack (#${{ github.event.issue.number }})"
          git push

      - name: Say it is listed
        if: steps.add.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const said = fs.existsSync('submission-ok.txt')
              ? fs.readFileSync('submission-ok.txt', 'utf8')
              : 'Listed. It will appear in the app shortly.';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body: said,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed',
            });
