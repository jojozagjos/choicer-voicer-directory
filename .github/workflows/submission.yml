name: Pack submission

# Runs when the app opens a submission issue. Validates the record, and either
# adds it to index.json or says on the issue what was wrong.
#
# A publisher nobody has looked at yet gets no further than validation: the
# issue stays open and a moderator lists the pack from inside the app, which
# writes the record with their own account. Once a publisher has been looked at
# once, later packs from them are listed here without waiting.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  review:
    # Only issues the app labelled. Anything else is a normal issue.
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fetched from the app rather than kept here. The directory has to refuse
      # exactly what the app refuses, and two copies of that rule drift the
      # moment one of them is edited — which is not noticed until something
      # invalid is listed, or something valid is turned away.
      - name: Fetch the validator from the app
        run: |
          base=https://raw.githubusercontent.com/jojozagjos/Choicer-Voicer-Content-Manager/main/src/main
          curl -fsSL "$base/directory.js" -o scripts/directory.js

      - name: Read the issue
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue-body.txt

      - name: Validate and add
        id: add
        continue-on-error: true
        # Through the environment, never interpolated into the command text.
        # See the note in moderate.yml: that position is where attacker-
        # controlled text would become executable.
        env:
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: node scripts/add-submission.js issue-body.txt "$SUBMITTER"

      - name: Say what was wrong
        if: steps.add.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const why = fs.existsSync('submission-error.txt')
              ? fs.readFileSync('submission-error.txt', 'utf8')
              : 'The submission could not be read.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: why + '\n\nFix it and edit the issue, and this will run again.',
            });

      # Before anything is listed, and on every submission including the ones
      # that never wait for a person. A check that only runs when somebody is
      # watching is a check that does not run.
      - name: Ask VirusTotal about the file
        id: virus
        if: steps.add.outcome == 'success'
        continue-on-error: true
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node scripts/virus-check.js "$(cat submission-sha.txt 2>/dev/null)"

      - name: Refuse a file that is flagged
        if: steps.virus.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const why = fs.existsSync('virus-error.txt')
              ? fs.readFileSync('virus-error.txt', 'utf8')
              : 'This file was refused by the malware check.';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body: why,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed',
            });
            core.setFailed('refused by the malware check');
      # Whether this account has earned listing without waiting. Decided by
      # add-submission.js, which knows the trust rules; this only reads its
      # answer.
      - name: Does this still need a person?
        id: gate
        if: steps.add.outcome == 'success'
        run: echo "auto=$(cat submission-auto.txt 2>/dev/null || echo no)" >> "$GITHUB_OUTPUT"

      # A publisher who has already had a pack read once does not need every
      # later one read too. One human look per publisher, not per pack.
      #
      # Committed straight to main. There are no pull requests anywhere in this
      # flow: opening one from a workflow needs a repository setting that is off
      # by default, which meant every first submission failed at that step and
      # could never be listed however long anybody waited.
      - name: List it, for an account that has earned that
        if: steps.add.outcome == 'success' && steps.gate.outputs.auto == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "List a pack from a known publisher (#${{ github.event.issue.number }})"
          git push

      - name: Say it is listed
        if: steps.add.outcome == 'success' && steps.gate.outputs.auto == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Listed. It will appear in the app shortly.',
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number, state: 'closed',
            });

      # A first pack waits for a person, and waiting means the issue stays open
      # with the record in it. The moderator reads the pack in the app and lists
      # it from there, which writes the record itself. Nothing is staged on a
      # branch in the meantime, so nothing is left behind if the answer is no.
      - name: Say it is waiting
        if: steps.add.outcome == 'success' && steps.gate.outputs.auto != 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'This pack passed every check and is waiting to be looked at. That '
                + 'happens once per publisher, not once per pack, so later ones will be '
                + 'listed straight away. Nothing else is needed from you.',
            });
