name: Pack submission

# Runs when the app opens a submission issue. Validates the record, and either
# adds it to index.json or says on the issue what was wrong.
#
# Deliberately does not merge anything on its own. The workflow prepares the
# change and a person presses the button, which is the whole of the moderation
# story until there is enough traffic to justify more.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  review:
    # Only issues the app labelled. Anything else is a normal issue.
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fetched from the app rather than kept here. The directory has to refuse
      # exactly what the app refuses, and two copies of that rule drift the
      # moment one of them is edited — which is not noticed until something
      # invalid is listed, or something valid is turned away.
      - name: Fetch the validator from the app
        run: |
          base=https://raw.githubusercontent.com/jojozagjos/Choicer-Voicer-Content-Manager/main/src/main
          curl -fsSL "$base/directory.js" -o scripts/directory.js
          curl -fsSL "$base/linkhealth.js" -o scripts/linkhealth.js

      - name: Read the issue
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue-body.txt

      - name: Validate and add
        id: add
        continue-on-error: true
        # Through the environment, never interpolated into the command text.
        # See the note in moderate.yml: that position is where attacker-
        # controlled text would become executable.
        env:
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: node scripts/add-submission.js issue-body.txt "$SUBMITTER"

      - name: Say what was wrong
        if: steps.add.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const why = fs.existsSync('submission-error.txt')
              ? fs.readFileSync('submission-error.txt', 'utf8')
              : 'The submission could not be read.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: why + '\n\nFix it and edit the issue, and this will run again.',
            });

      # Whether this account has earned listing without waiting. Decided by
      # add-submission.js, which knows the trust rules; this only reads its
      # answer. Without this step the answer was written and never looked at,
      # so every submission queued for review including trusted ones.
      - name: Does this still need a person?
        id: gate
        if: steps.add.outcome == 'success'
        run: echo "auto=$(cat submission-auto.txt 2>/dev/null || echo no)" >> "$GITHUB_OUTPUT"

      - name: Open the change for review
        id: pr
        if: steps.add.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          # Derived from the issue number, not the issue's own title. A title is
          # a stranger's text and would otherwise land in a commit message, a
          # branch name and a PR title unchecked. The pack's real name is in the
          # record, which has been validated.
          commit-message: "Pack submission #${{ github.event.issue.number }}"
          title: "Pack submission #${{ github.event.issue.number }}"
          body: |
            From #${{ github.event.issue.number }}.

            The record validated and the author matches the account hosting the
            file. **Review the pack itself before merging** — validation checks
            the shape of the record, not what is inside the pack.
          branch: submission/${{ github.event.issue.number }}
          delete-branch: true

      # A publisher who has already had a pack read by a person does not need
      # every later one read too. One human look per publisher, not per pack —
      # reviewing everything makes the maintainer the bottleneck, and a queue
      # nobody reaches is how a directory dies. `/hide` and `/ban` make a wrong
      # call cheap to undo.
      - name: List it without waiting, if this account has earned that
        if: steps.gate.outputs.auto == 'yes' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --squash --delete-branch --repo "${{ github.repository }}"
